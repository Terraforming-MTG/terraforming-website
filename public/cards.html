<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <title>Terraforming</title>
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
            <a class="brand" href="/">Terraforming</a>
        
            <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-links">Menu</button>
        
            <nav aria-label="Main">
            <ul class="links" id="nav-links">
                <li><a href="/">About</a></li>
                <li><a href="/rules">Rules</a></li>
                <li><a href="/cards" aria-current="page">Cards</a></li>
            </ul>
            </nav>
        </div>
        <div class="deck-bar" id="deck-bar" aria-hidden="true"></div>
    </header>
    <main>
        <h1>Card Lists</h1>
        <div class="list-select">
            <select name="list" id="list" disabled>
                <option value="">Loading lists...</option>
            </select>
        </div>
        <ul id="banlist"></ul>
        <p id="banlist-error" role="alert" hidden></p>
    </main>
    <script>
        const btn = document.getElementById('menu-btn');
        const links = document.getElementById('nav-links');
        btn.addEventListener('click', () => {
            const open = links.classList.toggle('open');
            btn.setAttribute('aria-expanded', open);
        });

        (function () {
        const bar = document.getElementById('deck-bar');
        const spell = Math.floor(Math.random() * 60);
        for (let i = 0; i < 60; i++) {
            const seg = document.createElement('span');
            if (i === spell) seg.className = 'spell';
            bar.appendChild(seg);
        }
        })();

        async function loadSelectedList() {
            const list = document.getElementById('banlist');
            const error = document.getElementById('banlist-error');
            const listSlug = document.getElementById('list').value;
            list.replaceChildren();
            error.hidden = true;

            try {
                const response = await fetch(
                    `/api/lists/${encodeURIComponent(listSlug)}/`
                );
                if (!response.ok) {
                    throw new Error(`List request failed (${response.status})`);
                }

                const selectedList = await response.json();
                const cardResponse = await fetch('/api/cards/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        oracle_ids: selectedList.cards.map(card => card.oracle_id)
                    })
                });
                if (!cardResponse.ok) {
                    throw new Error(`Card details request failed (${cardResponse.status})`);
                }
                const cardDetails = await cardResponse.json();
                const cardsByOracleId = new Map(
                    cardDetails.cards.map(card => [card.oracle_id, card])
                );

                for (const card of selectedList.cards) {
                    const cardDetails = cardsByOracleId.get(card.oracle_id);
                    const cardName = cardDetails?.name ?? card.oracle_id;
                    const imageUrl = cardDetails?.image_uri;

                    const item = document.createElement('li');
                    if (imageUrl && cardDetails.scryfall_uri) {
                        const anchor = document.createElement('a');
                        anchor.href = cardDetails.scryfall_uri;
                        anchor.target = '_blank';
                        anchor.rel = 'noopener noreferrer';
                        const img = document.createElement('img');
                        img.src = imageUrl;
                        img.height = 200;
                        img.width = 143;
                        img.alt = cardName;
                        anchor.appendChild(img);
                        item.appendChild(anchor);
                    } else {
                        item.textContent = cardName;
                    }
                    list.appendChild(item);
                }
            } catch (err) {
                error.textContent = `Could not load the ${listSlug} list.`;
                error.hidden = false;
                console.error(err);
            }
        }

        async function loadLists() {
            const selector = document.getElementById('list');
            const error = document.getElementById('banlist-error');

            try {
                const response = await fetch('/api/lists/');
                if (!response.ok) {
                    throw new Error(`Lists request failed (${response.status})`);
                }

                const lists = await response.json();
                selector.replaceChildren();

                for (const formatList of lists) {
                    const option = document.createElement('option');
                    option.value = formatList.slug;
                    option.textContent = formatList.name;
                    selector.appendChild(option);
                }

                if (lists.length === 0) {
                    error.textContent = 'No card lists are available.';
                    error.hidden = false;
                    return;
                }

                selector.disabled = false;
                selector.addEventListener('change', loadSelectedList);
                await loadSelectedList();
            } catch (err) {
                error.textContent = 'Could not load the card lists.';
                error.hidden = false;
                console.error(err);
            }
        }

        loadLists();
    </script>
</body>
</html>
